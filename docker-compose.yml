name: newtools

services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        image: newtools/app:8.0
        container_name: newtools-app
        restart: unless-stopped
        ports:
            - '${APP_PORT:-6666}:80'
        volumes:
            - '.:/var/www/html'
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - newtools

    mysql:
        image: 'mysql:8.0'
        container_name: newtools-mysql
        restart: unless-stopped
        ports:
            - '${FORWARD_DB_PORT:-13306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-secret}'
            MYSQL_DATABASE: '${DB_DATABASE:-newtools}'
            MYSQL_USER: '${DB_USERNAME:-newtools}'
            MYSQL_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'newtools-mysql:/var/lib/mysql'
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${DB_PASSWORD:-secret}']
            interval: 5s
            timeout: 5s
            retries: 20
        networks:
            - newtools

    redis:
        image: 'redis:alpine'
        container_name: newtools-redis
        restart: unless-stopped
        ports:
            - '${FORWARD_REDIS_PORT:-16379}:6379'
        volumes:
            - 'newtools-redis:/data'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 20
        networks:
            - newtools

    # Mailpit：攔截所有寄出的信，用 Web UI 看信（相容 MailHog 的 1025 / 8025）
    mailpit:
        image: 'axllent/mailpit:latest'
        container_name: newtools-mailpit
        restart: unless-stopped
        ports:
            - '${FORWARD_MAILPIT_PORT:-8025}:8025'
        networks:
            - newtools

networks:
    newtools:
        driver: bridge

volumes:
    newtools-mysql:
        driver: local
    newtools-redis:
        driver: local
